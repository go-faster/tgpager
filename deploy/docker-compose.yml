# tgpager as a service. See README.md for the bootstrap, which needs one
# interactive run to create the Telegram session.
name: tgpager

services:
  # Style-Bert-VITS2 serving the Portal GLaDOS voice. Optional: without it,
  # drop the tts section from tgpager.yml and pages play the tone alone.
  glados:
    # Upstream's own image. It has no CMD: it is built to be driven, so we
    # drive it. The command below matches 2.2, whose initialize.py differs
    # from master's, so pin the tag once a newer one is published.
    image: litagin/style-bert-vits2:latest
    working_dir: /sbv2
    # Only the BERT models are needed to synthesize. initialize.py in this
    # version has no flag for that and would also pull the training bases, so
    # the one function that matters is called directly.
    command:
      - sh
      - -c
      - python3 -c 'import initialize; initialize.download_bert_models()' && python3 server_fastapi.py
    restart: unless-stopped
    volumes:
      - ./glados/config.yml:/sbv2/config.yml:ro
      - ./glados/model_assets/Portal_GLaDOS_v1:/sbv2/model_assets/Portal_GLaDOS_v1:ro
      # Several GB of BERT weights, fetched once on first start.
      - glados-bert:/sbv2/bert
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First start downloads the BERT weights before it can serve.
      start_period: 900s
    # Synthesis runs on CPU by default, so this stack starts anywhere. For a
    # GPU, uncomment this and set server.device to cuda in glados/config.yml.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  tgpager:
    image: ghcr.io/go-faster/tgpager:latest
    restart: unless-stopped
    environment:
      # The SDK binds metrics to localhost, which nothing outside the container
      # can reach. Bind them to the container's interfaces instead.
      METRICS_ADDR: ":9464"
    ports:
      - "8080:8080"
      # Metrics. Drop this line to keep them off the host.
      - "127.0.0.1:9464:9464"
    volumes:
      # Session, peer cache and synthesized audio. Losing it means logging in
      # again, so it is a named volume rather than a bind mount.
      - data:/home/tgpager/data
      # The image's working directory is /home/tgpager, so this is the default
      # config path and every command below needs no -config flag.
      - ./tgpager.yml:/home/tgpager/tgpager.yml:ro
      - ./alert.ogg:/home/tgpager/alert.ogg:ro
    depends_on:
      glados:
        condition: service_healthy
    secrets:
      - telegram_app_hash
      - webhook_token
      # Uncomment together with the entry below to run as a bot.
      # - telegram_bot_token
    # There is no health endpoint; /metrics is the closest thing to one, and it
    # is enough to tell a live process from a wedged one.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9464/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  telegram_app_hash:
    file: ./secrets/telegram_app_hash
  webhook_token:
    file: ./secrets/webhook_token
  # telegram_bot_token:
  #   file: ./secrets/telegram_bot_token

volumes:
  data:
  glados-bert:
